server {
    # Hide server information
    server_tokens off;
    

    add_header Content-Security-Policy "default-src 'self'; frame-src 'self' https://*.azurewebsites.net blob:; script-src 'self' 'unsafe-inline' https://*.jsdelivr.net; style-src 'self' 'unsafe-inline' https: blob:; font-src 'self' data: https:; object-src 'none'; img-src * blob: data:; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; connect-src 'self' https://*.jsdelivr.net https://*.microsoftonline.com https://*.azure-api.net https://*.azurewebsites.net https://*.blob.core.windows.net https://dc.services.visualstudio.com wss://*.azure-api.net ws://* wss://* https://genor-copilot-app.bravecliff-cad39ba6.uaenorth.azurecontainerapps.io https://genor-dev-uaenorth-apim.azure-api.net/api/genone";
    add_header X-XSS-Protection "1; mode=block";  
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()";
    
    listen       80;
    server_name  localhost;
    
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
    
    # Prevent access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Custom error responses without server information
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
